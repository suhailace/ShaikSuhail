<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Entry Point</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }

    p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .counter-display {
      margin-top: 1.5rem;
      font-size: 1.25rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Single-File App</h1>
    <p>Everything HTML, CSS, and JavaScript is included in this single file. Ideal for GitHub Pages.</p>
    <button class="btn" id="clickBtn">Click Me</button>
    <div class="counter-display">
      Clicks: <span id="count">0</span>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let count = 0;
      const btn = document.getElementById('clickBtn');
      const countDisplay = document.getElementById('count');

      btn.addEventListener('click', () => {
        count++;
        countDisplay.textContent = count;
      });
    });
  </script>

</body>
</html>
